# Optional: run Patty without PHP installed. `docker compose up --build`.
# No `environment:` block on purpose; see the note in docker/entrypoint.sh.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Only the SQLite file lives here, so the code and migrations stay in the image.
      - patty-data:/data

volumes:
  patty-data:
