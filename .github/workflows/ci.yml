name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    name: Style and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The Journal step diffs against the base branch, which needs full history.
          fetch-depth: 0

      - name: Journal (D-033, D-040)
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(app|routes|database|resources)/'; then
            if ! echo "$changed" | grep -qE '^docs/(progress\.md|tickets/PTY-[^/]*\.md)$'; then
              echo "Code changed but neither docs/progress.md nor a docs/tickets/PTY-*.md file did."
              exit 1
            fi
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependency audit (S14)
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Test suite (Pest)
        run: vendor/bin/pest
